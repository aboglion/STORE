services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-http://127.0.0.1:54321}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost}
    image: store-app:prod
    container_name: store_commerce_prod
    restart: unless-stopped
    ports:
      - "${HOST_HTTP_PORT:-80}:3000"
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - path: .env
        required: false
      - path: .env.local
        required: false
    environment:
      - NODE_ENV=production
      - PORT=3000
      - TZ=Asia/Jerusalem
      - SUPABASE_INTERNAL_URL=http://host.docker.internal:54321
      - SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0}
      # ------------------------------------------------------------------
      # Database backup system — backups are stored OUTSIDE Docker on the
      # host under ${BACKUP_DIR:-/home/uns/store-backups} (bind-mounted as
      # /backups) so they survive container rebuilds.
      # ------------------------------------------------------------------
      - BACKUP_DIR=/backups
      - BACKUP_STORAGE_DIR=/supabase-storage
      - BACKUP_TZ=${BACKUP_TZ:-Asia/Jerusalem}
      # Direct Postgres connection used by pg_dump / pg_restore inside the
      # container (local Supabase defaults; override via .env.local).
      - PGHOST=host.docker.internal
      - PGPORT=${PGPORT:-54322}
      - PGUSER=${PGUSER:-postgres}
      - PGPASSWORD=${PGPASSWORD:-postgres}
      - PGDATABASE=${PGDATABASE:-postgres}
    volumes:
      # Persistent backup directory on the host (outside Docker).
      - ${BACKUP_DIR:-/home/uns/store-backups}:/backups
      # Supabase Storage files (product images / logos) — read for backup,
      # restored on the host by backup-host.sh (volume is root-owned).
      - supabase_storage_omar:/supabase-storage:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

# External volumes created by `npx supabase start` (project "omar").
volumes:
  supabase_storage_omar:
    external: true
