{% extends "base.html" %}
{% block content %}
<div class="col-md-6 mx-auto mt-5">
    <div class="card shadow">
        <div class="card-body">
            <h3 class="mb-4 text-center">התחברות עם מספר טלפון</h3>
            <div id="step1">
                <div class="input-group mb-3">
                    <span class="input-group-text">+972</span>
                    <input type="text" id="phone" class="form-control" placeholder="הכנס מספר טלפון (ללא קידומת)">
                </div>
                <div id="recaptcha-container"></div>
                <button class="btn btn-primary w-100 mt-2" onclick="sendCode()">שלח קוד</button>
            </div>
            <div id="step2" style="display:none;">
                <input type="text" id="code" class="form-control mb-2" placeholder="הכנס קוד שקיבלת ב-SMS">
                <button class="btn btn-success w-100" onclick="verifyCode()">אמת</button>
            </div>
            <div id="result" class="mt-3 text-center"></div>
        </div>
        <div class="card-footer text-center">
            <small class="text-muted">
                חדש באתר? <a href="{% url 'accounts:user_register' %}">צור חשבון</a>
            </small>
        </div>
    </div>
</div>
{% endblock %}
{% block extra_js %}
<script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth-compat.js"></script>
<script>
    // 1. Initialize Firebase
    const firebaseConfig = {
        apiKey: "AIzaSyCgK_isBjIE3Wnn8naJep-spYHN_8pVwe4",
        authDomain: "storefirst-a560c.firebaseapp.com",
        projectId: "storefirst-a560c",
        storageBucket: "storefirst-a560c.firebasestorage.app",
        messagingSenderId: "616381390287",
        appId: "1:616381390287:web:8c3e78e2f5721def3506ba",
        measurementId: "G-KM5LMBFYP9"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    auth.languageCode = 'he';

    // 2. Initialize the reCAPTCHA verifier
    let recaptchaVerifier;
    window.onload = function() {
        recaptchaVerifier = new firebase.auth.RecaptchaVerifier('recaptcha-container', {
            'size': 'invisible',
            'callback': function(response) {
                console.log('reCAPTCHA solved');
            },
            'expired-callback': function() {
                console.error('reCAPTCHA expired');
                recaptchaVerifier.render().then(function(widgetId) { grecaptcha.reset(widgetId); });
            }
        });
        recaptchaVerifier.render();
    };

    // 3. Send SMS code
    function sendCode() {
        let phoneInput = document.getElementById("phone").value.trim().replace(/\D/g, '');

        // Remove leading '0' if it exists
        if (phoneInput.startsWith('0')) {
            phoneInput = phoneInput.substring(1);
        }

        const phoneNumber = "+972" + phoneInput;

        auth.signInWithPhoneNumber(phoneNumber, recaptchaVerifier)
            .then(function(confirmationResult) {
                window.confirmationResult = confirmationResult;
                document.getElementById("step1").style.display = "none";
                document.getElementById("step2").style.display = "block";
            })
            .catch(function(error) {
                document.getElementById("result").innerText = error.message;
            });
    }

    // 4. Verify SMS code and send accessToken to Django
    function verifyCode() {
        const code = document.getElementById("code").value;
        window.confirmationResult.confirm(code)
            .then(function(result) {
                const user = result.user;
                user.getIdToken().then(function(accessToken) {
                    fetch("/accounts/firebase_login/", {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({ accessToken: accessToken })
                    })
                    .then(function(response) { return response.json(); })
                    .then(function(data) {
                        if (data.status === "authenticated") {
                            window.location.href = "/";
                        } else {
                            document.getElementById("result").innerText = data.error || "שגיאת התחברות";
                        }
                    });
                });
            })
            .catch(function(error) {
                document.getElementById("result").innerText = error.message;
            });
    }
</script>
{% endblock %}
