{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <link rel="stylesheet" href="{% static 'css/enhanced.css' %}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
body {
  font-family: 'Segoe UI', 'Arial', sans-serif;
  background: linear-gradient(135deg, #f8fafc 0%, #e3e8ff 100%);
  color: #232b3b;
  margin: 0;
  min-height: 100vh;
}
.dashboard-white-title {
  font-weight: 800;
  color: #2d3a4a;
  margin-bottom: 18px;
  letter-spacing: 0.5px;
  text-shadow: 0 2px 8px #e3e8ff;
  font-size: 2.1em;
}
.card, .dashboard-white-card {
  box-shadow: 0 8px 32px rgba(60,60,120,0.18);
  border-radius: 22px;
  background: linear-gradient(135deg, #fff 70%, #e3e8ff 100%);
  border: 1px solid #e3e8ff;
  padding: 2.2rem 2rem 1.5rem 2rem;
  margin-bottom: 2rem;
  transition: box-shadow 0.3s, transform 0.3s;
}
.card:hover, .dashboard-white-card:hover {
  box-shadow: 0 16px 48px rgba(60,60,120,0.22);
  transform: translateY(-6px) scale(1.02);
}
.p-4 {
  padding: 1.5rem !important;
}
.mt-5 {
  margin-top: 3rem !important;
}
.text-muted {
  color: #7b8ca7 !important;
  font-size: 1em;
}
.alert {
  border-radius: 10px;
  font-weight: 500;
  box-shadow: 0 2px 12px #e3e8ff55;
  background: linear-gradient(90deg, #fffbe6 60%, #ffe9b3 100%);
  color: #b8860b;
  border: none;
  padding: 1em 1.2em;
  margin-bottom: 1em;
}
hr {
  border: none;
  border-top: 2px solid #e3e8ff;
  margin: 1em 0;
}
@media (max-width: 900px) {
  .card, .dashboard-white-card {
    padding: 1.2rem 0.7rem 1rem 0.7rem;
  }
  .dashboard-menu {
    min-width: 120px;
    font-size: 1em;
    padding: 1rem 0.5rem;
  }
}
</style>
<style>
.dashboard-menu {
  background: linear-gradient(135deg, #374151 60%, #4f8cff 100%);
  color: #fff;
  border-radius: 16px;
  box-shadow: 0 2px 16px #4f8cff33;
  padding: 1.5rem 1.2rem;
  margin-bottom: 1.5rem;
  display: flex;
  flex-direction: column;
  gap: 0.7rem;
  align-items: flex-start;
  font-size: 1.08em;
  min-width: 180px;
  border: 1px solid #4f8cff44;
  animation: fadeInMenu 0.7s;
}
@keyframes fadeInMenu {
  from { opacity: 0; transform: translateY(20px);}
  to { opacity: 1; transform: translateY(0);}
}
.dashboard-menu h4 {
  margin: 0;
  width: 100%;
  padding: 0;
}
.dashboard-menu hr {
  width: 100%;
  border: none;
  border-top: 1.5px solid #6e6eff55;
  margin: 0.5em 0 0.5em 0;
}
.dashboard-link {
  color: #fff;
  background: none;
  border: none;
  font-weight: 500;
  font-size: 1em;
  padding: 0.5em 1em;
  border-radius: 10px;
  text-decoration: none;
  transition: 
    color 0.2s, 
    background 0.2s, 
    box-shadow 0.25s cubic-bezier(.4,2,.6,1), 
    text-decoration 0.2s,
    filter 0.25s;
  position: relative;
  display: block;
  width: 100%;
  box-shadow: 0 0px 0px transparent;
  outline: none;
}
.dashboard-link:hover, .dashboard-link:focus {
  color: #ffd700 !important;
  background: #232b3b !important;
  text-decoration: underline !important;
  box-shadow: 0 4px 24px 0 #ffd70066, 0 0 8px 2px #ffd70088 !important;
  filter: brightness(1.13) drop-shadow(0 0 8px #ffd700cc) !important;
  z-index: 3;
  outline: none !important;
}
.logout-link {
  color: #ff6e6e !important;
  font-weight: 600;
}
.logout-link:hover, .logout-link:focus {
  color: #fff !important;
  background: #dc3545 !important;
  text-decoration: underline !important;
  box-shadow: 0 4px 24px 0 #ff6e6e99, 0 0 8px 2px #dc3545cc !important;
  filter: brightness(1.1) drop-shadow(0 0 6px #dc3545cc) !important;
}
</style>
</head>
<body>
    <div class="row mt-5">
        <div class="col-md-1"></div>

        <!-- Main Content -->
        <div class="col-md-7">
            <div class="card">
                <h2 class="dashboard-white-title text-capitalize">{{ title }}</h2>
                <div class="p-4">
                    {% if messages %}
                        {% for message in messages %}
                            <div class="alert alert-{{ message.tags }}">{{ message }}</div>
                        {% endfor %}
                    {% endif %}
                    {% block content %}{% endblock %}
                </div>
            </div>
        </div>

        <!-- Sidebar -->
        <div class="col-md-3">
            <div class="card">
                <h3 class="dashboard-white-title" style="font-size:1.3em; margin-bottom:18px;">Menu</h3>

<nav class="dashboard-menu">
    <h4><a class="dashboard-link" href="{% url 'dashboard:products' %}">כל המוצרים</a></h4>
    <h4><a class="dashboard-link" href="{% url 'dashboard:add_product' %}">➕ מוצר חדש</a></h4>
    <h4><a class="dashboard-link" href="{% url 'dashboard:add_category' %}">➕ קטגוריה חדשה</a></h4>
    <h4><a class="dashboard-link" href="{% url 'dashboard:orders' %}">📦 הזמנות</a></h4>
    <hr>
    <h4><a class="dashboard-link" href="{% url 'home_page' %}">🛍️ חזרה לחנות</a></h4>
    <h4><a class="dashboard-link logout-link" href="{% url 'accounts:user_logout' %}">🚪 התנתקות</a></h4>
</nav>

                <div class="text-muted mt-2">You logged in as: {{ request.user.email }}</div>
            </div>
        </div>

        <div class="col-md-1"></div>
    </div>
</body>
</html>
